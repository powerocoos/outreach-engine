name = "outreach-dashboard"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "outreach"
database_id = "2c7ac847-c075-4f30-9c2f-30c802b54d97"

# The website chatbot's own database (Worker "website-chatbot"). The Chat leads page reads it and
# marks leads contacted. Read-mostly: the dashboard only adds status/handled_at columns to its leads table.
[[d1_databases]]
binding = "CHAT_DB"
database_name = "website-chatbot"
database_id = "d45b138b-2ba1-4ef9-8db1-85687cbb4644"

# Secrets (set with `wrangler secret put NAME`, never commit):
#   DASHBOARD_PASSWORD  - Basic-auth password for the dashboard
#   WEBHOOK_SECRET      - shared secret Instantly sends with webhooks
#   INSTANTLY_API_KEY   - Instantly API key (scope: leads:create) for Send to Instantly
#   API_TOKEN           - bearer token for POST /api/leads (pipeline import)
#   META_PAGE_ID, META_PAGE_TOKEN, META_IG_USER_ID - optional: publish approved social posts to Facebook/Instagram
#   GITHUB_DISPATCH_TOKEN - optional: lets the Worker start the weekday outreach run if GitHub's schedule is late (see docs)
#   TWILIO_SID, TWILIO_TOKEN, TWILIO_FROM, ALERT_PHONE - speed-to-lead SMS to your own phone

[triggers]
crons = ["*/30 * * * *"]   # every 30 min: poll Instantly for replies/bounces, and publish scheduled social posts that are due

[vars]
INSTANTLY_CAMPAIGN_ID = "54f9440b-6237-442c-8057-14e3150ce4b6"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "outreach-media"   # create with: npx wrangler r2 bucket create outreach-media
